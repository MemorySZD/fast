<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🎮 GameVault · Google Sheet + Add Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0b0d15;
            --bg-secondary: #12162a;
            --bg-card: #1a1f3a;
            --bg-card-hover: #232a4d;
            --text-primary: #f0f3ff;
            --text-secondary: #9aa3cc;
            --accent-1: #6c5ce7;
            --accent-2: #a29bfe;
            --accent-3: #00d4ff;
            --accent-glow: rgba(108, 92, 231, 0.35);
            --radius: 18px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #ff6b6b;
            --success: #51cf66;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 0 40px 0;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-1);
            border-radius: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 60px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn:hover {
            transform: translateY(-2px);
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .btn-primary {
            background: var(--accent-1);
            color: #fff;
            border-color: var(--accent-1);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-primary:hover {
            background: #7c6df0;
        }
        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #5fdb7e;
        }
        .btn-sm {
            padding: 6px 16px;
            font-size: 0.75rem;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-outline:hover {
            background: var(--bg-card);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: #fff;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: rgba(81, 207, 102, 0.3);
            background: #1a2f1a;
        }
        .toast.error {
            border-color: rgba(255, 107, 107, 0.3);
            background: #2f1a1a;
        }
        /* Hero */
        .hero {
            padding: 32px 0 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .hero-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .hero-left h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--accent-2) 70%, var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .hero-left .badge {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(108, 92, 231, 0.25);
            padding: 4px 14px;
            border-radius: 100px;
            color: var(--accent-2);
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        /* Add Game Form */
        .add-game-section {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .add-game-section h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .add-game-section .sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }
        .add-game-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .add-game-form .full-width {
            grid-column: 1 / -1;
        }
        .add-game-form label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }
        .add-game-form input,
        .add-game-form select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .add-game-form input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .add-game-form input::placeholder {
            color: var(--text-secondary);
            opacity: 0.4;
        }
        .add-game-form .form-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 8px 0 28px 0;
        }
        .search-wrap {
            position: relative;
            width: 100%;
        }
        .search-wrap .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.4;
            pointer-events: none;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .search-wrap input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .search-wrap input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: var(--bg-card);
        }
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .filter-chips button {
            padding: 6px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-chips button:hover {
            background: var(--bg-card);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }
        .filter-chips button.active {
            background: var(--accent-1);
            color: #fff;
            border-color: var(--accent-1);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .filter-chips button .count {
            opacity: 0.5;
            font-weight: 400;
            font-size: 0.65rem;
            margin-left: 4px;
        }
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 8px 0 20px 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .grid-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .grid-header h2 strong {
            color: #fff;
            font-weight: 800;
        }
        .grid-header .result-count {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 18px;
        }
        .game-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: inherit;
        }
        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }
        .game-card:hover {
            transform: translateY(-6px) scale(1.01);
            background: var(--bg-card-hover);
            border-color: rgba(108, 92, 231, 0.25);
            box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(108, 92, 231, 0.1);
        }
        .game-card:hover::before {
            opacity: 1;
        }
        .game-card .icon-big {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
            transition: var(--transition);
        }
        .game-card:hover .icon-big {
            transform: scale(1.08) rotate(-2deg);
        }
        .game-card .game-name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            margin: 4px 0 2px;
            line-height: 1.3;
        }
        .game-card .game-category {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-2);
            background: rgba(108, 92, 231, 0.15);
            padding: 2px 14px;
            border-radius: 100px;
            display: inline-block;
            margin: 6px 0 4px;
        }
        .game-card .game-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #fbbf24;
            margin-top: 6px;
        }
        .game-card .game-rating span {
            color: var(--text-secondary);
            font-size: 0.7rem;
        }
        .game-card .game-grade {
            font-size: 0.7rem;
            font-weight: 700;
            background: rgba(108, 92, 231, 0.2);
            padding: 2px 12px;
            border-radius: 100px;
            color: var(--accent-2);
            margin-top: 4px;
        }
        .game-card .card-glow {
            position: absolute;
            top: -40%;
            right: -20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }
        .game-card:hover .card-glow {
            opacity: 1;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
        .empty-state .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }
        .empty-state p {
            color: var(--text-secondary);
            margin-top: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            grid-column: 1 / -1;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .loading-state .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 2rem;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        /* Detail (optional) */
        .game-detail {
            animation: fadeUp 0.4s ease forwards;
            padding: 10px 0 30px 0;
        }
        .game-detail .back-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .game-detail .detail-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .game-detail .detail-card .big-icon {
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 12px;
        }
        .game-detail .detail-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .game-detail .detail-card .cat-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent-2);
            background: rgba(108, 92, 231, 0.15);
            padding: 4px 20px;
            border-radius: 100px;
            margin: 6px 0 16px 0;
        }
        .game-detail .detail-card .rating-big {
            font-size: 1.4rem;
            color: #fbbf24;
            margin: 8px 0 20px 0;
        }
        .game-detail .detail-card .rating-big span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-left: 6px;
        }
        .game-detail .detail-card .play-link {
            display: inline-block;
            padding: 14px 40px;
            background: var(--accent-1);
            color: #fff;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 0 30px var(--accent-glow);
            border: none;
            cursor: pointer;
        }
        .game-detail .detail-card .play-link:hover {
            background: #7c6df0;
            transform: translateY(-3px);
        }
        .game-detail .detail-card .game-link-text {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            word-break: break-all;
        }
        .game-detail .detail-card .game-link-text a {
            color: var(--accent-3);
            text-decoration: none;
        }
        .game-detail .detail-card .game-link-text a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 56px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        .footer a {
            color: var(--accent-2);
            text-decoration: none;
        }
        .footer a:hover {
            color: #fff;
        }
        @media (max-width: 700px) {
            .add-game-form {
                grid-template-columns: 1fr;
            }
            .add-game-form .full-width {
                grid-column: 1;
            }
            .hero {
                flex-direction: column;
                align-items: flex-start;
            }
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
        @media (max-width: 500px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }
            .game-card {
                padding: 14px 10px 12px;
            }
            .game-card .icon-big {
                font-size: 2.4rem;
            }
            .game-card .game-name {
                font-size: 0.85rem;
            }
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .game-card {
            animation: fadeUp 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>
    <div class="container" id="app">

        <!-- ═══ HERO ═══ -->
        <header class="hero">
            <div class="hero-left">
                <h1>🎮 GameVault</h1>
                <span class="badge">📊 Google Sheet</span>
            </div>
            <!-- कुनै extra action छैन, सबै main page मै छ -->
        </header>

        <!-- ═══ ADD GAME FORM ═══ -->
        <section class="add-game-section">
            <h2>➕ Add New Game</h2>
            <p class="sub">Fill in the details below and submit. It will be saved to Google Sheet instantly.</p>
            <form class="add-game-form" id="addGameForm">
                <div>
                    <label for="gameName">Game Name *</label>
                    <input type="text" id="gameName" placeholder="e.g. Elden Ring" required />
                </div>
                <div>
                    <label for="gameCategory">Category *</label>
                    <input type="text" id="gameCategory" placeholder="e.g. RPG, Action" required />
                </div>
                <div>
                    <label for="gameIcon">Icon (emoji or URL)</label>
                    <input type="text" id="gameIcon" placeholder="🎮 or https://example.com/icon.png" />
                </div>
                <div>
                    <label for="gameRating">Rating (1–5)</label>
                    <input type="number" id="gameRating" placeholder="4.8" min="0" max="5" step="0.1" />
                </div>
                <div class="full-width">
                    <label for="gameLink">Game Link (URL) *</label>
                    <input type="url" id="gameLink" placeholder="https://example.com/play" required />
                </div>
                <div class="full-width form-actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add Game</button>
                    <button type="reset" class="btn btn-outline">Clear</button>
                </div>
            </form>
        </section>

        <!-- ═══ SEARCH & FILTER ═══ -->
        <div class="controls">
            <div class="search-wrap">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search games by name or category…" autocomplete="off" />
            </div>
            <div class="filter-chips" id="filterContainer">
                <!-- populated by JS -->
            </div>
        </div>

        <!-- ═══ GRID HEADER ═══ -->
        <div class="grid-header">
            <h2>🔥 <strong id="showingLabel">All</strong> games</h2>
            <span class="result-count" id="resultCount">0 found</span>
        </div>

        <!-- ═══ GAME GRID ═══ -->
        <div class="game-grid" id="gameGrid">
            <div class="loading-state">
                <div class="spinner">⏳</div>
                <div>Loading games from Google Sheet…</div>
            </div>
        </div>

        <!-- ═══ DETAIL VIEW (hidden) ═══ -->
        <div id="detailView" class="hidden">
            <div class="game-detail">
                <div class="back-bar">
                    <button class="btn btn-outline btn-sm" id="backFromDetailBtn">← Back to list</button>
                </div>
                <div class="detail-card" id="detailCard"></div>
            </div>
        </div>

        <footer class="footer">
            <p>✦ Data stored in <strong>Google Sheet</strong> &bull; Add games directly from this page</p>
        </footer>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  🔥 यहाँ आफ्नो Google Apps Script Web App URL राख्नुहोस्
        // ═══════════════════════════════════════════════════════════════
        const API_URL = 'https://script.google.com/macros/s/AKfycbzAB0W_-qLneCr2QI4ogMFsB4-CL0kqbavTI4qMSmdpdvaX8rf7NOAAG3s7JnHAX5XhlQ/exec'; // <-- Replace with your deployed URL

        // ═══════════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════════
        let allGames = [];
        let activeCategory = 'All';
        let searchQuery = '';

        // ═══════════════════════════════════════════════════════════════
        //  DOM REFS
        // ═══════════════════════════════════════════════════════════════
        const form = document.getElementById('addGameForm');
        const gameName = document.getElementById('gameName');
        const gameCategory = document.getElementById('gameCategory');
        const gameIcon = document.getElementById('gameIcon');
        const gameRating = document.getElementById('gameRating');
        const gameLink = document.getElementById('gameLink');
        const submitBtn = document.getElementById('submitBtn');

        const grid = document.getElementById('gameGrid');
        const searchInput = document.getElementById('searchInput');
        const filterContainer = document.getElementById('filterContainer');
        const showingLabel = document.getElementById('showingLabel');
        const resultCount = document.getElementById('resultCount');

        const detailView = document.getElementById('detailView');
        const detailCard = document.getElementById('detailCard');
        const backFromDetailBtn = document.getElementById('backFromDetailBtn');

        const toast = document.getElementById('toast');
        let toastTimer = null;

        // ═══════════════════════════════════════════════════════════════
        //  TOAST
        // ═══════════════════════════════════════════════════════════════
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ═══════════════════════════════════════════════════════════════
        //  API CALLS
        // ═══════════════════════════════════════════════════════════════
        async function fetchGames() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching games:', error);
                showToast('⚠️ Failed to load games. Please try again.', 'error');
                return [];
            }
        }

        async function addGame(gameData) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(gameData),
                });
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Error adding game:', error);
                return { success: false, error: error.message };
            }
        }

        // ═══════════════════════════════════════════════════════════════
        //  RENDER HELPERS
        // ═══════════════════════════════════════════════════════════════
        function renderStars(rating) {
            if (!rating || rating < 0) return '☆☆☆☆☆';
            const r = Math.min(Math.max(rating, 0), 5);
            const full = Math.floor(r);
            const half = r - full >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return '⭐'.repeat(full) + (half ? '⭐' : '') + '☆'.repeat(empty);
        }

        function getGrade(rating) {
            if (!rating || rating < 0) return 'N/A';
            if (rating >= 4.5) return 'A+';
            if (rating >= 4.0) return 'A';
            if (rating >= 3.5) return 'B+';
            if (rating >= 3.0) return 'B';
            if (rating >= 2.5) return 'C+';
            if (rating >= 2.0) return 'C';
            if (rating >= 1.0) return 'D';
            return 'F';
        }

        function getCategories() {
            const cats = allGames.map(g => g.category);
            return ['All', ...new Set(cats)];
        }

        function getFilteredGames() {
            return allGames.filter(game => {
                const matchCategory = activeCategory === 'All' || game.category === activeCategory;
                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q ||
                    game.name.toLowerCase().includes(q) ||
                    game.category.toLowerCase().includes(q);
                return matchCategory && matchSearch;
            });
        }

        function renderFilters() {
            const categories = getCategories();
            const counts = {};
            allGames.forEach(g => {
                counts[g.category] = (counts[g.category] || 0) + 1;
            });
            counts['All'] = allGames.length;

            filterContainer.innerHTML = categories.map(cat => {
                const count = counts[cat] || 0;
                const activeClass = cat === activeCategory ? 'active' : '';
                return `
                            <button class="${activeClass}" data-category="${cat}">
                                ${cat} <span class="count">(${count})</span>
                            </button>
                        `;
            }).join('');

            filterContainer.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.dataset.category;
                    renderFilters();
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            const filtered = getFilteredGames();

            if (filtered.length === 0) {
                grid.innerHTML = `
                            <div class="empty-state">
                                <span class="big-emoji">🎮</span>
                                <h3>No games found</h3>
                                <p>Add your first game using the form above!</p>
                            </div>
                        `;
                resultCount.textContent = '0 found';
                showingLabel.textContent = activeCategory === 'All' ? 'All' : activeCategory;
                return;
            }

            grid.innerHTML = filtered.map(game => `
                        <div class="game-card" data-id="${game.id || game.name}">
                            <div class="card-glow"></div>
                            <div class="icon-big">${game.icon || '🎮'}</div>
                            <div class="game-name">${game.name}</div>
                            <span class="game-category">${game.category}</span>
                            <div class="game-rating">
                                ${renderStars(game.rating)}
                                <span>${game.rating ? game.rating.toFixed(1) : '—'}</span>
                            </div>
                            <div class="game-grade">${getGrade(game.rating)}</div>
                        </div>
                    `).join('');

            // Click on card → detail view (optional, but we keep it)
            grid.querySelectorAll('.game-card').forEach(card => {
                card.addEventListener('click', () => {
                    // Find game by name (or use data-id)
                    const name = card.querySelector('.game-name').textContent;
                    const game = allGames.find(g => g.name === name);
                    if (game) showDetail(game);
                });
            });

            resultCount.textContent = `${filtered.length} found`;
            showingLabel.textContent = activeCategory === 'All' ? 'All' : activeCategory;
        }

        // ─── Detail View (optional) ───
        function showDetail(game) {
            detailView.classList.remove('hidden');
            detailCard.innerHTML = `
                        <div class="big-icon">${game.icon || '🎮'}</div>
                        <h1>${game.name}</h1>
                        <div class="cat-tag">${game.category}</div>
                        <div class="rating-big">
                            ${renderStars(game.rating)}
                            <span>${game.rating ? game.rating.toFixed(1) : 'Not rated'}</span>
                            <span style="margin-left:12px;font-size:1rem;color:var(--accent-2);">Grade: ${getGrade(game.rating)}</span>
                        </div>
                        ${game.link ? `
                            <a href="${game.link}" target="_blank" rel="noopener noreferrer" class="play-link">
                                ▶ Play Game
                            </a>
                            <div class="game-link-text">
                                🔗 <a href="${game.link}" target="_blank" rel="noopener noreferrer">${game.link}</a>
                            </div>
                        ` : `
                            <p style="color:var(--text-secondary);">No game link provided.</p>
                        `}
                    `;
            // Hide grid and show detail
            document.querySelector('.controls').style.display = 'none';
            document.querySelector('.grid-header').style.display = 'none';
            grid.style.display = 'none';
            // We'll manage visibility via back button
        }

        function hideDetail() {
            detailView.classList.add('hidden');
            document.querySelector('.controls').style.display = '';
            document.querySelector('.grid-header').style.display = '';
            grid.style.display = '';
        }

        backFromDetailBtn.addEventListener('click', hideDetail);

        // ═══════════════════════════════════════════════════════════════
        //  LOAD DATA
        // ═══════════════════════════════════════════════════════════════
        async function loadData() {
            grid.innerHTML = `
                        <div class="loading-state">
                            <div class="spinner">⏳</div>
                            <div>Loading games from Google Sheet…</div>
                        </div>
                    `;
            const data = await fetchGames();
            if (Array.isArray(data)) {
                allGames = data;
            } else {
                allGames = [];
                showToast('⚠️ No data received from server.', 'error');
            }
            renderFilters();
            renderGrid();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalGames').textContent = allGames.length;
            const cats = new Set(allGames.map(g => g.category));
            document.getElementById('totalCategories').textContent = cats.size;
        }

        // ═══════════════════════════════════════════════════════════════
        //  FORM SUBMIT
        // ═══════════════════════════════════════════════════════════════
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = gameName.value.trim();
            const category = gameCategory.value.trim();
            const icon = gameIcon.value.trim() || '🎮';
            const rating = parseFloat(gameRating.value) || 0;
            const link = gameLink.value.trim();

            if (!name || !category || !link) {
                showToast('⚠️ Please fill in Name, Category, and Link.', 'error');
                return;
            }

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Adding…';

            const result = await addGame({ name, category, icon, rating, link });

            if (result.success) {
                showToast('✅ Game added successfully!', 'success');
                form.reset();
                // Reload data
                await loadData();
            } else {
                showToast('❌ Failed to add game: ' + (result.error || 'Unknown error'), 'error');
            }

            submitBtn.disabled = false;
            submitBtn.textContent = '➕ Add Game';
        });

        // ═══════════════════════════════════════════════════════════════
        //  SEARCH
        // ═══════════════════════════════════════════════════════════════
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        // ═══════════════════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════════════════
        loadData();

        // Update total games/categories (these are static, we'll update after load)
        // We'll call updateStats in loadData after data is set.

        console.log('🔧 GameVault with Google Apps Script');
        console.log('📡 API URL:', API_URL);
    </script>

</body>
</html>
