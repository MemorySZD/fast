<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>📸 Pro Camera</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== GALLERY VIEWER (Full Screen) ===== */
    #gallery-viewer {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }
    #gallery-viewer.open {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .viewer-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 10;
    }
    .viewer-header .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }
    .viewer-header .back-btn:hover {
      background: rgba(255,255,255,0.25);
    }
    .viewer-header .back-btn:active {
      transform: scale(0.92);
    }
    .viewer-header .counter {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-weight: 500;
    }
    .viewer-header .download-btn-header {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .viewer-header .download-btn-header:hover {
      background: rgba(255,255,255,0.25);
    }

    .viewer-image-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .viewer-image-container img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      transition: 0.3s;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      touch-action: manipulation;
    }
    .viewer-nav:active {
      transform: translateY(-50%) scale(0.9);
      background: rgba(255,255,255,0.25);
    }
    .viewer-nav.prev {
      left: 16px;
    }
    .viewer-nav.next {
      right: 16px;
    }
    .viewer-nav.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .viewer-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      z-index: 10;
    }
    .viewer-footer .footer-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .viewer-footer .footer-btn:active {
      transform: scale(0.92);
    }
    .viewer-footer .footer-btn.download-all {
      background: rgba(59, 130, 246, 0.4);
    }
    .viewer-footer .footer-btn.download-all:hover {
      background: rgba(59, 130, 246, 0.6);
    }
    .viewer-footer .footer-btn.back-camera {
      background: rgba(255, 255, 255, 0.2);
    }
    .viewer-footer .footer-btn.back-camera:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Gallery Grid */
    #gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      max-height: 70vh;
      overflow-y: auto;
      background: #111;
    }
    #gallery-grid .gallery-item {
      aspect-ratio: 1;
      overflow: hidden;
      background: #222;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }
    #gallery-grid .gallery-item:active {
      transform: scale(0.95);
    }
    #gallery-grid .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #gallery-grid .gallery-item .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }
    .empty-gallery {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 16px;
    }

    /* Gallery Container */
    #gallery-container {
      display: none;
      flex-direction: column;
      background: #0a0a0a;
      height: 100vh;
      position: fixed;
      inset: 0;
      z-index: 50;
      animation: slideUp 0.3s ease;
    }
    #gallery-container.open {
      display: flex;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .gallery-header span {
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .gallery-header .close-gallery {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .gallery-grid-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      background: #0a0a0a;
    }

    /* Responsive */
    @media (max-width: 480px) {
      #gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
      }
      .viewer-nav {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }
      .viewer-footer .footer-btn {
        font-size: 12px;
        padding: 8px 14px;
      }
      .viewer-header .back-btn {
        font-size: 12px;
        padding: 6px 12px;
      }
      .viewer-header .download-btn-header {
        font-size: 12px;
        padding: 6px 12px;
      }
    }
    @media (max-width: 380px) {
      #gallery-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
      }
    }
  </style>
</head>
<body>

  <!-- Permission Overlay -->
  <div id="permission-overlay">
    <div class="spinner"></div>
    <p>क्यामेरा खोल्न अनुमति माग्दै...</p>
    <div id="perm-error" class="error" style="display:none;"></div>
  </div>

  <!-- Top Bar -->
  <div id="top-bar" style="display:none;">
    <div class="left">
      <span class="status-dot online" id="statusDot"></span>
      <span class="title">📸 Pro Camera</span>
    </div>
    <div class="right">
      <button class="play-game-btn" id="playGameBtn">🎮 Play Game</button>
      <button class="top-btn" id="gridBtn">📐 Grid</button>
      <button class="top-btn" id="flashBtn">🔦 Flash</button>
    </div>
  </div>

  <!-- Camera Container -->
  <div id="camera-container" style="display:none;">
    <video id="video" autoplay playsinline></video>
    <div id="grid-overlay"><div class="hline"></div><div class="hline"></div><div class="vline"></div><div class="vline"></div></div>
    <div id="flash-overlay"></div>

    <!-- Live Zoom Display -->
    <div id="zoom-live-display" onclick="toggleZoomSwipe()">
      <span id="zoom-level-display">1.0x</span>
      <span id="zoom-focal-display">26mm</span>
    </div>
  </div>

  <!-- Zoom Presets -->
  <div id="zoom-presets-area" style="display:none;">
    <div class="zoom-presets">
      <button class="zoom-preset" data-zoom="0.5">0.5x</button>
      <button class="zoom-preset active" data-zoom="1">1x</button>
      <button class="zoom-preset" data-zoom="3">3x</button>
      <button class="zoom-preset" data-zoom="7">7x</button>
      <button class="zoom-preset" data-zoom="10">10x</button>
      <button class="zoom-preset" data-zoom="50">50x</button>
    </div>
  </div>

  <!-- ===== GALLERY CONTAINER ===== -->
  <div id="gallery-container">
    <div class="gallery-header">
      <span>📸 Gallery (<span id="galleryCount">0</span>)</span>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="downloadAllBtn" class="close-gallery" style="background:rgba(59,130,246,0.3);">⬇️ सबै</button>
        <button id="closeGalleryBtn" class="close-gallery">✕ Close</button>
      </div>
    </div>
    <div class="gallery-grid-container" id="galleryGridContainer">
      <div id="gallery-grid"></div>
    </div>
  </div>

  <!-- ===== FULL-SCREEN VIEWER ===== -->
  <div id="gallery-viewer">
    <div class="viewer-header">
      <button class="back-btn" id="viewerBackBtn">⬅️ Back</button>
      <span class="counter" id="viewerCounter">1 / 10</span>
      <button class="download-btn-header" id="viewerDownloadBtn">⬇️ Download</button>
    </div>
    <div class="viewer-image-container">
      <button class="viewer-nav prev" id="viewerPrev">‹</button>
      <img id="viewerImage" src="" alt="Photo" />
      <button class="viewer-nav next" id="viewerNext">›</button>
    </div>
    <div class="viewer-footer">
      <button class="footer-btn back-camera" id="viewerBackCameraBtn">📷 Back to Camera</button>
      <button class="footer-btn download-all" id="viewerDownloadAllBtn">⬇️ Download All</button>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div id="bottom-bar" style="display:none;">
    <button class="bottom-btn" id="galleryToggleBtn"><span class="icon">🖼️</span><span class="bottom-label">Gallery</span></button>
    <button class="bottom-btn" id="flipBtn"><span class="icon">🔄</span><span class="bottom-label">Flip</span></button>
    <div id="capture-btn"><div class="inner"></div></div>
    <button class="bottom-btn" id="effectsBtn"><span class="icon">🎨</span></button>
    <button class="bottom-btn" id="aspectBtn"><span class="icon">📐</span><span class="bottom-label" id="aspectLabel">16:9</span></button>
  </div>

  <!-- Dropdowns -->
  <div class="dropdown-overlay" id="effectsDropdown">
    <div class="item selected" data-effect="none">Normal</div>
    <div class="item" data-effect="sepia">Sepia</div>
    <div class="item" data-effect="grayscale">Grayscale</div>
    <div class="item" data-effect="blur">Blur</div>
    <div class="item" data-effect="invert">Invert</div>
    <div class="item" data-effect="brightness">Brightness</div>
    <div class="item" data-effect="contrast">Contrast</div>
    <div class="item" data-effect="hue">Hue Rotate</div>
    <div class="item" data-effect="pixelated">Pixelated</div>
  </div>
  <div class="dropdown-overlay" id="aspectDropdown">
    <div class="item" data-aspect="free">Free</div>
    <div class="item" data-aspect="1:1">1:1</div>
    <div class="item" data-aspect="4:3">4:3</div>
    <div class="item selected" data-aspect="16:9">16:9</div>
    <div class="item" data-aspect="21:9">21:9</div>
  </div>

  <!-- Fly Image -->
  <img id="fly-img" />

  <script src="js/app.js" defer></script>
</body>
</html>
